[project]
name = "archymedes-sitewatch"
version = "0.1.0a1"
description = "Offline site-sensor fault diagnosis prototype (synthetic-validated)"
requires-python = ">=3.12"
license = "Apache-2.0"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["F", "E9", "I", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
