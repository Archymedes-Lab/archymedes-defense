# DevSecOps pipeline, after the DoD Enterprise DevSecOps Fundamentals (v2.5) control gates:
# build and unit test, static analysis (SAST), software composition analysis with an SBOM, secret scanning.
# Every gate must pass before a change counts as releasable (see docs/program/ROADMAP.md).
name: devsecops

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:  # V&V Plan section 1: verification tests, scope rules and the hazard log
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: World and simulation tests
        working-directory: world
        run: uv run pytest -q
      - name: Lint
        working-directory: world
        run: uv run ruff check archworld tests
      - name: Package tests
        run: |
          for d in datascope evalevidence sitewatch; do
            (cd "$d" && uv run --no-project --with pytest python -m pytest -q)
          done

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Tests (world-file tests need the locally built world data and run in the release flow)
        run: bun test $(ls tests/*.test.ts | grep -v 'tests/world.test.ts')

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Python static analysis (bandit, medium severity and above)
        run: uvx bandit -q -r world/archworld datascope evalevidence sitewatch -ll

  codeql:  # GitHub code scanning is free on public repositories
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3

  supply-chain:  # SBOM and known-vulnerability scan of every dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: anchore/scan-action@v5
        with:
          sbom: sbom.spdx.json
          fail-build: true
          severity-cutoff: critical
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source /repo --no-banner --redact
