[project]
name = "archworld"
version = "0.1.0a1"
description = "Archymedes synthetic world: open-data terrain, imagery, buildings and roads with per-feature provenance"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1",
  "pyproj>=3.7",
  "rasterio>=1.4",
  "pyogrio>=0.10",
  "shapely>=2.0",
  "pillow>=11",
  "mapbox-earcut>=1.0",
  "affine>=3.0.1",
]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.120", "ruff>=0.8"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
